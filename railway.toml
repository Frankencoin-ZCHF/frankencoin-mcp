# Railway deployment config — stateless, read-only, no build step.
# Nixpacks auto-detects Node from package.json; there is NO build command.

[build]
builder = "nixpacks"

[deploy]
startCommand = "node src/index.js --http"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# No [[volumes]] — the server is fully stateless (webhook subsystem removed).
# COINGECKO_API_KEY / DUNE_API_KEY are optional; absence only degrades two tools.
